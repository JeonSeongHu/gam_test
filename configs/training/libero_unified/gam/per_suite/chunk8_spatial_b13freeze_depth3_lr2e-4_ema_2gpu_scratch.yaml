# CVLAB1 2-GPU spatial-only gam scratch run.
#
# Differences vs `chunk8_object_fullunfreeze_predlr1_depth5_ema_4n_scratch.yaml`:
#   - suite: libero_object  ->  libero_spatial
#   - freeze_blocks_before: 0  ->  13   (DA3 blocks 0..12 frozen, 13..39 trained)
#   - lambda_depth: 5.0  ->  3.0
#   - base_lr: 1.0e-4 (uniform)  ->  base_lr 1.0e-5 (backbone) with
#       head/predictor_lr_mult=20  =>  head & predictor LR = 2e-4
#   - eval_every: 5000  ->  2000
#   - global_batch_size: 96 (4 nodes * 16 GPUs * 6) -> 32 (2 GPU * 16 micro)
#   - closed_loop_eval.use_ema: true  (rollout uses EMA shadow)
#   - paths: CSCS  ->  CVLAB1 NHNHOME

stage_1:
  ckpt_path: ${oc.env:DA3_ROOT,.}/checkpoints/track4world_da3.pth
  encoder_input_size: 224
  normalization_stat_path: null

da3_finetune:
  enabled: true
  freeze_blocks_before: 13
  n_action_steps: 8
  n_views: 2
  use_temporal_embed: false
  action_input_rate: 0.4

action_head:
  type: mlp_resnet
  input_dim: 1536
  hidden_dim: 1536
  n_dims: 7
  chunk_size: 8
  chunk_position_encoding: learned
  num_blocks: 2
  pool_mode: mean

regularization:
  lambda_feat: 0.0
  layer_weight_min: 0.5
  adaptive_lambda: false
  lambda_depth: 3.0
  depth_grad_weight: 1.0
  depth_decode_chunk_size: 8
  lambda_camera: 0.0

proprioception:
  enabled: true
  proprio_dim: 7
  hidden_dim: 256

predictor:
  enabled: true
  type: gam
  d_model: 1024
  depth: 12
  num_heads: 16
  ffn_ratio: 4.0
  dropout: 0.0
  num_patches_per_view: 256
  use_language: true
  language_dim: 768
  language_len: 77
  clip_model: openai/clip-vit-large-patch14
  sigreg_proj_dim: 256
  sigreg_n_projections: 1024
  sigreg_knots: 17
  sigreg_max_knot: 3.0
  sigreg_redraw: true
  sigreg_pool_mode: cls
  lambda_feat_current: 0.0
  lambda_feat_future: 1.0
  lambda_sigreg: 0.0
  feature_loss_type: l1
  H_choices:
  - 1
  H_weights:
  - 1.0

  num_register_tokens: 0
  deep_gradient_checkpointing: true

training:
  global_batch_size: 256             # 2 GPU * micro 16 * grad_accum 1
  micro_batch_size: 128
  base_lr: 2.0e-5                   # backbone (DA3 blocks 13..39, proprio_conditioner)
  head_lr_mult: 10.0                # action_head  -> 2e-4
  predictor_lr_mult: 10.0           # future_predictor + text_conditioner.proj -> 2e-4
  adam_eps: 1.0e-06
  weight_decay: 0.0
  lambda_action: 3.0
  grad_accum_steps: 1
  epochs: 500000
  clip_grad: 1.0
  warmup_steps: 0
  max_steps: 150000
  min_lr_ratio: 0.01
  log_every: 50
  ckpt_every: 2000
  vis_every: 500
  eval_every: 2000
  global_seed: 42
  num_workers: 8
  bf16: true
  compile: false
  persistent_workers: true
  ema:
    enabled: true
    decay: 0.999
    device: cpu
    dtype: float32
    update_every: 1
    start_step: 0
    include:
    - future_predictor
    - action_head
    - text_conditioner_proj
    - student_da3_blocks
    student_da3_blocks_start: 13
    student_da3_blocks_end: 39
  closed_loop_eval:
    enabled: true
    use_ema: true                  # rollout the EMA shadow, not live params
    history_horizon: 3
    suites:
    - libero_spatial
    num_tasks_per_suite: all
    num_trials_per_task: 5
    num_steps_wait: 10
    action_horizon: 1
    action_repeat: 1
    action_repeat_mode: split_delta
    env_control_hz: 20
    policy_hz: 20
    camera_size: 128
    seed: 7
    env_seed: 0
    log_video: true
    video_max_per_eval: 4
    detailed_video: true
    max_steps_by_suite:
      libero_spatial: 220
      libero_object: 280
      libero_goal: 300
      libero_10: 520

dataset:
  type: libero_hdf5
  hdf5_root: ${oc.env:DA3_ROOT,.}/data/libero_hdf5/yifengzhu-hf/LIBERO-datasets
  stats_dir: ${oc.env:DA3_ROOT,.}/data/libero_hdf5/_stats
  image_size:
  - 224
  - 224
  future_steps: 1
  chunk_size: 8
  include_current_action: true
  eval_ratio: 0.05
  proprio_dim: 7
  n_views: 2
  source_fps: 20
  da3_input_rotate180: true
  da3_input_vflip: false
  # OpenVLA-OFT-style train-only color jitter (eval bypassed in dataset code).
  # color_jitter_brightness: 0.3
  # color_jitter_contrast: 0.4
  # color_jitter_saturation: 0.5
  # color_jitter_hue: 0.08
  gt_depth_root: ${oc.env:DA3_ROOT,.}/gt_depth/libero_aligned_hide_sites_fast
  gt_depth_rotate180: true
  gt_depth_vflip: false
  gt_depth_require_geometry: true
  gt_depth_scale_mode: pointmap
  gt_depth_min_meters: 0.001
  action_stats_samples: 10000
  proprio_stats_samples: 10000
  camera_keys:
  - agentview_rgb
  - eye_in_hand_rgb
  suites:
  - libero_spatial

use_dit: false
