# Daint per-suite full-unfreeze gam scratch run.
# Suite: libero_object. 4 nodes x 4 GH200, DDP only.
#
# This is the bounded depth-weight follow-up to the 2026-04-25 scratch runs.
# The latest object scratch run with lambda_depth=1.0 had an avg20 weighted
# contribution around action/feature/depth = 0.470/0.318/0.027, so an exact
# 1:1:1 depth match would require an overly large depth coefficient. This
# probe uses lambda_depth=5.0 instead and enables the Stage 1 subset EMA.

stage_1:
  ckpt_path: ${oc.env:DA3_ROOT,.}/checkpoints/track4world_da3.pth
  encoder_input_size: 224
  normalization_stat_path: null

da3_finetune:
  enabled: true
  freeze_blocks_before: 0
  n_action_steps: 8
  n_views: 2
  use_temporal_embed: false
  action_input_rate: 0.4

action_head:
  type: mlp_resnet
  input_dim: 1536
  hidden_dim: 1536
  n_dims: 7
  chunk_size: 8
  chunk_position_encoding: learned
  num_blocks: 2
  pool_mode: mean

regularization:
  lambda_feat: 0.0
  layer_weight_min: 0.5
  adaptive_lambda: false
  lambda_depth: 5.0
  depth_grad_weight: 1.0
  depth_decode_chunk_size: 8
  lambda_camera: 0.0

proprioception:
  proprio_dim: 7

predictor:
  enabled: true
  type: gam
  d_model: 1024
  depth: 12
  num_heads: 16
  ffn_ratio: 4.0
  dropout: 0.0
  num_patches_per_view: 256
  use_language: true
  language_dim: 768
  language_len: 77
  clip_model: openai/clip-vit-large-patch14
  lambda_feat_future: 1.0
  lambda_sigreg: 0.0
  feature_loss_type: l1
  H_choices:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  H_weights:
  - 0.142857
  - 0.142857
  - 0.142857
  - 0.142857
  - 0.142857
  - 0.142857
  - 0.142858
  num_register_tokens: 0
  deep_gradient_checkpointing: true

training:
  global_batch_size: 96
  micro_batch_size: 6
  base_lr: 1.0e-4
  head_lr_mult: 1.0
  predictor_lr_mult: 1.0
  adam_eps: 1.0e-06
  weight_decay: 0.0
  lambda_action: 3.0
  grad_accum_steps: 1
  epochs: 500000
  clip_grad: 1.0
  warmup_steps: 100
  max_steps: 150000
  min_lr_ratio: 0.01
  log_every: 50
  ckpt_every: 5000
  vis_every: 500
  eval_every: 5000
  global_seed: 42
  num_workers: 8
  bf16: true
  compile: false
  persistent_workers: true
  ema:
    enabled: true
    decay: 0.999
    device: cpu
    dtype: float32
    update_every: 1
    start_step: 0
    include:
    - future_predictor
    - action_head
    - text_conditioner_proj
    - student_da3_blocks
    student_da3_blocks_start: 13
    student_da3_blocks_end: 39
  closed_loop_eval:
    history_horizon: 3
    enabled: true
    suites:
    - libero_object
    num_tasks_per_suite: all
    num_trials_per_task: 5
    num_steps_wait: 10
    action_horizon: 1
    action_repeat: 1
    action_repeat_mode: split_delta
    env_control_hz: 20
    policy_hz: 20
    camera_size: 128
    seed: 7
    env_seed: 0
    log_video: true
    video_max_per_eval: 4
    detailed_video: true
    max_steps_by_suite:
      libero_spatial: 220
      libero_object: 280
      libero_goal: 300
      libero_10: 520

dataset:
  type: libero_hdf5
  hdf5_root: ${oc.env:DA3_ROOT,.}/data/libero_hdf5/yifengzhu-hf/LIBERO-datasets
  stats_dir: ${oc.env:DA3_ROOT,.}/data/libero_hdf5/_stats
  image_size:
  - 224
  - 224
  future_steps: 7
  chunk_size: 8
  include_current_action: true
  eval_ratio: 0.05
  proprio_dim: 7
  n_views: 2
  source_fps: 20
  da3_input_rotate180: true
  da3_input_vflip: false
  gt_depth_root: ${oc.env:DA3_ROOT,.}/gt_depth/libero_aligned_hide_sites_fast
  gt_depth_rotate180: true
  gt_depth_vflip: false
  gt_depth_require_geometry: true
  gt_depth_scale_mode: pointmap
  gt_depth_min_meters: 0.001
  action_stats_samples: 10000
  proprio_stats_samples: 10000
  camera_keys:
  - agentview_rgb
  - eye_in_hand_rgb
  suites:
  - libero_object

use_dit: false
